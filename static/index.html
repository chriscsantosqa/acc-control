<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COC Control · Village Intelligence</title>
<style>
:root{--bg:#080b11;--panel:#111722;--panel2:#171f2c;--line:#293449;--text:#f1f5fb;--muted:#93a1b7;--blue:#58c4ff;--ok:#55d991;--warn:#f4c35b;--danger:#ff747c;--gold:#f6cf4a;--r:15px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% -10%,#173456 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif}button,input,textarea{font:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px;border-right:1px solid var(--line);background:rgba(8,11,17,.95)}.brand{font-size:20px;font-weight:850;margin-bottom:20px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#68758b;margin:15px 7px 8px}.villages{display:grid;gap:6px}.village{width:100%;display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;padding:8px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.village:hover,.village.active{background:var(--panel2);border-color:var(--line)}.village img{width:42px;height:42px;object-fit:contain}.village b,.village span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.village span{font-size:11px;color:var(--muted)}.actions{display:grid;gap:7px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#517095}.btn.primary{background:#1b6f9f;border-color:#2d91c9}.btn.danger{color:#ff9da3}.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line);background:rgba(8,11,17,.88);backdrop-filter:blur(12px)}.spacer{flex:1}.identity{font-size:12px;color:var(--muted)}main{min-width:0}.content{max-width:1450px;margin:auto;padding:22px}.hero{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(135deg,#121b2a,#101722 60%,#1c2230)}.hero img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 12px 18px #0007)}.hero h1{font-size:30px;margin:0}.tag{font-family:Consolas,monospace;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#0b111b;border-radius:999px;padding:5px 9px;font-size:12px;color:#cbd5e5}.chip img{width:18px;height:18px;filter:none}.hero-actions{display:grid;gap:7px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:999px;cursor:pointer}.tab.active{background:#15314b;color:#fff;border-color:#286489}.view{display:none}.view.active{display:block}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}.card,.section{border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}.card{padding:14px}.card small{display:block;color:#74839c;text-transform:uppercase;letter-spacing:.07em}.card strong{display:block;font-size:23px;margin:5px 0}.muted{color:var(--muted)}.section{padding:15px;margin-top:14px}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.progress{height:7px;background:#09101a;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#3e9cd6,#62d7ff)}.categories{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}.category{padding:11px;border:1px solid #222d40;border-radius:12px;background:var(--panel2)}.category b{display:flex;justify-content:space-between;margin-bottom:6px}.resources{display:flex;gap:8px;flex-wrap:wrap}.resource{display:flex;gap:7px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0b111a}.resource img{width:28px;height:28px;object-fit:contain}.resource small{display:block;color:var(--muted)}.upgrade-list{display:grid;gap:8px}.upgrade{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px;border:1px solid #222d40;border-radius:12px;background:var(--panel2)}.upgrade img{width:42px;height:42px;object-fit:contain}.upgrade small{display:block;color:var(--muted)}.arsenal-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.arsenal{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}.unit{min-height:145px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:9px;border:1px solid #2a374c;border-radius:13px;background:linear-gradient(145deg,#1a2434,#101721);overflow:hidden}.unit.max{border-color:#a78c24;box-shadow:inset 0 0 0 1px #f6cf4a22}.unit img{position:absolute;top:5px;width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 8px 12px #0008)}.unit b{font-size:12px;line-height:1.2}.lvl{margin-top:4px;min-width:35px;padding:2px 7px;border:1px solid #3a4860;border-radius:999px;font-weight:800}.unit.max .lvl{border-color:var(--gold);color:#fff1a2}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #222d40;text-align:left}.table th{font-size:11px;text-transform:uppercase;color:#748198}.history{display:grid;gap:6px}.history-row{display:grid;grid-template-columns:160px 80px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #222d40}.empty{padding:34px;text-align:center;color:var(--muted)}.notice{margin-bottom:12px;padding:10px 12px;border:1px solid #765d20;border-radius:10px;background:#2a220f;color:#ffda78}.notice.error{border-color:#7d3439;background:#2d1517;color:#ffadb2}.modal-bg{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:#000b;padding:18px}.modal-bg.open{display:grid}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:#111722}.modal h3{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#0a111b;color:#fff}.field textarea{min-height:140px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}.toastbox{position:fixed;right:18px;bottom:18px;z-index:90;display:grid;gap:7px}.toast{max-width:360px;padding:10px 12px;border:1px solid #36516f;border-radius:10px;background:#182332}.mobile{display:none}.footer{text-align:center;color:#647087;font-size:11px;margin:26px 0}.asset-missing{opacity:.25}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:100px 1fr}.hero img{width:95px;height:95px}.hero-actions{grid-column:1/-1;display:flex}}@media(max-width:760px){.layout{display:block}.side{position:fixed;left:-280px;z-index:60;width:255px;transition:.2s}.side.open{left:0;box-shadow:18px 0 60px #000a}.mobile{display:inline-block}.content{padding:13px}.top{padding:10px 13px}.hero{grid-template-columns:75px 1fr;padding:13px}.hero img{width:72px;height:72px}.hero h1{font-size:22px}.metrics{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.history-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="side"><div class="brand">⚔ COC Control<small>Village Intelligence</small></div><div class="label">Suas vilas</div><div class="villages" id="villages"></div><div class="label">Ações</div><div class="actions"><button class="btn primary" onclick="openModal('newModal')">+ Adicionar vila</button><button class="btn" onclick="openModal('importModal')">Importar JSON</button><button class="btn" onclick="syncAll()">Sincronizar todas</button><button class="btn" onclick="openSettings()">Configurações</button></div></aside>
<main><div class="top"><button class="btn mobile" onclick="side.classList.toggle('open')">☰</button><div class="identity" id="identity">Carregando…</div><div class="spacer"></div><button class="btn" onclick="logout()">Sair</button></div><div class="content" id="app"><div class="empty">Carregando vilas…</div></div></main>
</div>
<div class="toastbox" id="toastbox"></div>
<div class="modal-bg" id="newModal"><div class="modal"><h3>Adicionar vila</h3><div class="form"><div class="field"><label>Nome</label><input id="newName" placeholder="Minha principal"></div><div class="field"><label>Tag</label><input id="newTag" placeholder="#ABC123"></div><div class="field full"><label>Notas</label><textarea id="newNotes"></textarea></div></div><div class="modal-actions"><button class="btn" onclick="closeModals()">Cancelar</button><button class="btn primary" onclick="createVillage()">Adicionar</button></div></div></div>
<div class="modal-bg" id="importModal"><div class="modal"><h3>Importar export da vila</h3><div class="field"><label>JSON exportado pelo jogo</label><textarea id="importJson" placeholder="Cole o JSON aqui"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModals()">Cancelar</button><button class="btn primary" onclick="importJson()">Importar</button></div></div></div>
<div class="modal-bg" id="settingsModal"><div class="modal"><h3>Configurações</h3><div id="settingsBody"></div><div class="modal-actions"><button class="btn" onclick="closeModals()">Fechar</button><button class="btn primary" onclick="saveSettings()">Salvar</button></div></div></div>
<script>
'use strict';
const state={me:null,accounts:[],selected:null,detail:null,tab:'overview',arsenal:'heroes'};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function csrf(){return document.cookie.split('; ').find(v=>v.startsWith('csrf='))?.split('=')[1]||''}
async function api(url,opt={}){const o={...opt,headers:{...(opt.headers||{})}};if(o.json!==undefined){o.body=JSON.stringify(o.json);o.headers['Content-Type']='application/json';delete o.json}if(o.method&&o.method!=='GET')o.headers['X-CSRF']=csrf();const r=await fetch(url,o);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function toast(msg,error=false){const el=document.createElement('div');el.className='toast';if(error)el.style.borderColor='#8a3d44';el.textContent=msg;$('toastbox').append(el);setTimeout(()=>el.remove(),4500)}
function slug(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
const aliases={'p-e-k-k-a':'pekka','l-a-s-s-i':'lassi','barbarian-king':'barbarian-king','archer-queen':'archer-queen','grand-warden':'grand-warden','royal-champion':'royal-champion','minion-prince':'minion-prince'};
function asset(folder,name,ext='webp'){let s=slug(name);s=aliases[s]||s;return `/static/assets/coc/${folder}/${s}.${ext}`}
function image(src,alt='',cls=''){return `<img class="${cls}" src="${src}" alt="${esc(alt)}" onerror="this.classList.add('asset-missing');this.removeAttribute('src')">`}
function fmt(v){return new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1}).format(+v||0)}function pct(v){return `${Math.round((+v||0)*10)/10}%`}function date(ts){return ts?new Date(ts*1000).toLocaleString('pt-BR'):'—'}function duration(s){s=Math.max(0,Math.floor(+s||0));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return [d&&`${d}d`,h&&`${h}h`,m&&`${m}m`].filter(Boolean).join(' ')||'<1m'}
function thAsset(level){return `/static/assets/coc/townhall/th${level||1}.webp`}
async function boot(){try{state.me=await api('/api/me');$('identity').textContent=`${state.me.name||state.me.email||'Usuário'} · ${state.me.role==='owner'?'dono':'assinante'}`;state.accounts=await api('/api/accounts');renderVillages();if(state.accounts.length)await selectVillage(state.accounts[0].id);else renderEmpty()}catch(e){if(e.message.includes('não autenticado'))location.href='/login';else $('app').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function renderVillages(){$('villages').innerHTML=state.accounts.map(a=>`<button class="village ${a.id===state.selected?'active':''}" onclick="selectVillage(${a.id})">${image(thAsset(a.latest?.th_level),'TH')}<div><b>${esc(a.name)}</b><span>${esc(a.tag||'sem tag')} · ${a.latest?`TH ${a.latest.th_level}`:'sem export'}</span></div></button>`).join('')||'<div class="muted">Nenhuma vila.</div>'}
function renderEmpty(){$('app').innerHTML='<div class="empty"><h2>Nenhuma vila cadastrada</h2><p>Adicione uma vila e sincronize com a API oficial da Supercell ou importe o JSON do jogo.</p></div>'}
async function selectVillage(id){state.selected=id;renderVillages();try{state.detail=await api(`/api/accounts/${id}/detail`);renderDetail()}catch(e){toast(e.message,true)}}
function heroMeta(d){const p=d.player||{},a=d.account||{},s=d.summary||{};return `<div class="hero">${image(thAsset(s.th_level||p.townHallLevel),'Centro da Vila')}<div><h1>${esc(p.name||a.name)}</h1><div class="tag">${esc(p.tag||a.tag||'')}</div><div class="chips"><span class="chip">TH ${s.th_level||p.townHallLevel||'—'}</span>${p.trophies!==undefined?`<span class="chip">${image('/static/assets/coc/icons/trophy.webp','')} ${fmt(p.trophies)} troféus</span>`:''}${p.league?`<span class="chip">${esc(typeof p.league==='string'?p.league:p.league.name||'Liga')}</span>`:''}${p.warStars!==undefined?`<span class="chip">${image('/static/assets/coc/icons/star.webp','')} ${fmt(p.warStars)} estrelas</span>`:''}${a.verified?'<span class="chip">✓ Conta verificada</span>':''}</div></div><div class="hero-actions"><button class="btn primary" onclick="syncOne()">Sincronizar API</button><button class="btn" onclick="openModal('importModal')">Importar export</button></div></div>`}
function renderDetail(){const d=state.detail;$('app').innerHTML=`${!state.me.active?`<div class="notice">Seu passe está inativo. Seus dados foram preservados; renove na Clash Labs para voltar às vilas.</div>`:''}${heroMeta(d)}<div class="tabs">${[['overview','Visão geral'],['arsenal','Arsenal'],['upgrades','Upgrades'],['planner','Planejamento'],['history','Histórico']].map(([k,n])=>`<button class="tab ${state.tab===k?'active':''}" onclick="setTab('${k}')">${n}</button>`).join('')}</div><div id="view-overview" class="view ${state.tab==='overview'?'active':''}">${renderOverview(d)}</div><div id="view-arsenal" class="view ${state.tab==='arsenal'?'active':''}">${renderArsenal(d.player?._raw||{})}</div><div id="view-upgrades" class="view ${state.tab==='upgrades'?'active':''}">${renderUpgrades(d.summary)}</div><div id="view-planner" class="view ${state.tab==='planner'?'active':''}"><div class="section" id="planBody"><div class="empty">Abra esta aba para calcular o plano.</div></div></div><div id="view-history" class="view ${state.tab==='history'?'active':''}">${renderHistory(d)}</div><div class="footer">COC Control não é afiliado, endossado ou patrocinado pela Supercell.</div>`;if(state.tab==='planner')loadPlan()}
function setTab(k){state.tab=k;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));event.currentTarget.classList.add('active');$(`view-${k}`).classList.add('active');if(k==='planner')loadPlan()}
function renderOverview(d){const s=d.summary,p=d.player||{};if(!s)return '<div class="section empty">Importe um export da vila para calcular progresso, custos e tempos.</div>';const b=s.builders||{};return `<div class="grid metrics"><div class="card"><small>Progresso total</small><strong>${pct(s.progress_total)}</strong><div class="progress"><span style="width:${Math.min(100,+s.progress_total||0)}%"></span></div></div><div class="card"><small>Níveis pendentes</small><strong>${fmt(s.pending_total)}</strong><span class="muted">até o máximo do TH</span></div><div class="card"><small>Construtores</small><strong>${b.free??'—'} / ${b.total??'—'}</strong><span class="muted">livres / total</span></div><div class="card"><small>Laboratório</small><strong>${s.lab?.busy?'Ocupado':'Livre'}</strong><span class="muted">${s.lab?.finish_ts?`termina ${date(s.lab.finish_ts)}`:'fila de pesquisa'}</span></div><div class="card"><small>ETA estimado</small><strong>${duration(s.eta?.seconds||s.eta?.total_seconds||0)}</strong><span class="muted">estimativa do export atual</span></div></div>${p.trophies!==undefined?`<div class="section"><div class="section-head"><h2>Perfil do jogador</h2></div><div class="resources"><div class="resource"><b>${fmt(p.trophies)}</b><small>Troféus</small></div><div class="resource"><b>${fmt(p.bestTrophies)}</b><small>Recorde</small></div><div class="resource"><b>${fmt(p.attackWins)}</b><small>Ataques vencidos</small></div><div class="resource"><b>${fmt(p.defenseWins)}</b><small>Defesas vencidas</small></div><div class="resource"><b>${fmt(p.donations)}</b><small>Doações</small></div><div class="resource"><b>${fmt(p.donationsReceived)}</b><small>Recebidas</small></div></div></div>`:''}${renderCosts(s.cost_left)}<div class="section"><div class="section-head"><h2>Progresso por categoria</h2></div><div class="grid categories">${Object.entries(s.categories||{}).map(([k,v])=>`<div class="category"><b><span>${esc(v.label||k)}</span><span>${pct(v.progress)}</span></b><div class="progress"><span style="width:${Math.min(100,+v.progress||0)}%"></span></div><small>${fmt(v.pending)} níveis pendentes</small></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Upgrades ativos</h2></div><div class="upgrade-list">${(s.active_upgrades||[]).map(renderActive).join('')||'<div class="empty">Nenhum timer ativo no último export.</div>'}</div></div>`}
function renderCosts(cost){const entries=Object.entries(cost||{}).filter(([,v])=>+v>0);if(!entries.length)return '';return `<div class="section"><div class="section-head"><h2>Recursos restantes</h2></div><div class="resources">${entries.map(([k,v])=>`<div class="resource">${image(asset('resources',k),'')}<div><b>${fmt(v)}</b><small>${esc(k)}</small></div></div>`).join('')}</div></div>`}
function renderActive(x){return `<div class="upgrade">${image(asset(unitFolder(x,x.category),x.name),x.name)}<div><b>${esc(x.name)}</b><small>${esc(x.category||x.queue||'')} · nível ${x.to_lvl||'—'}</small></div><div><b data-finish="${x.finish_ts||0}">${duration((x.finish_ts||0)-Date.now()/1000)}</b><small>${x.finish_ts?date(x.finish_ts):''}</small></div></div>`}
function unitFolder(x,kind){const village=x.village||x.villageType||'';const name=String(x.name||'').toLowerCase();if(kind==='heroes'||name.includes('king')||name.includes('queen')||name.includes('warden')||name.includes('champion')||name.includes('prince'))return 'heroes';if(kind==='equipment')return 'equipment';if(kind==='spells'||name.includes('spell'))return 'spells';if(kind==='pets'||village==='pet')return 'pets';return 'troops'}
function renderArsenal(raw){const sets={heroes:raw.heroes||[],equipment:raw.heroEquipment||[],troops:(raw.troops||[]).filter(x=>(x.village||x.villageType||'home')!=='builderBase'),spells:raw.spells||[],siege:(raw.troops||[]).filter(x=>/siege|wall wrecker|battle blimp|stone slammer|barracks|launcher|drill/i.test(x.name||'')),pets:(raw.troops||[]).filter(x=>/lassi|owl|yak|unicorn|frosty|diggy|lizard|phoenix|jelly|fox|raven|sneezy/i.test(x.name||''))};const labels={heroes:'Heróis',equipment:'Equipamentos',troops:'Tropas',spells:'Feitiços',siege:'Máquinas',pets:'Pets'};const current=sets[state.arsenal]||[];return `<div class="section"><div class="section-head"><h2>Arsenal do jogador</h2><span class="muted">Player API oficial</span></div><div class="arsenal-filter">${Object.keys(labels).map(k=>`<button class="tab ${state.arsenal===k?'active':''}" onclick="setArsenal('${k}')">${labels[k]} · ${sets[k].length}</button>`).join('')}</div><div class="grid arsenal">${renderUnits(current,state.arsenal)}</div></div>`}
function setArsenal(k){state.arsenal=k;$('view-arsenal').innerHTML=renderArsenal(state.detail?.player?._raw||{})}
function renderUnits(items,kind){if(!items.length)return '<div class="empty" style="grid-column:1/-1">Nenhum item retornado pela API.</div>';return items.map(x=>{const max=+x.level>0&&+x.maxLevel>0&&+x.level>=+x.maxLevel;return `<div class="unit ${max?'max':''}">${image(asset(unitFolder(x,kind),x.name),x.name)}<b>${esc(x.name)}</b><span class="lvl">${x.level??'—'}${x.maxLevel?`/${x.maxLevel}`:''}</span></div>`}).join('')}
function renderUpgrades(s){if(!s)return '<div class="section empty">Sem export para calcular upgrades.</div>';return `<div class="section"><div class="section-head"><h2>Upgrades em andamento</h2></div><div class="upgrade-list">${(s.active_upgrades||[]).map(renderActive).join('')||'<div class="empty">Nenhum timer ativo.</div>'}</div></div><div class="section"><div class="section-head"><h2>Maiores pendências</h2></div><div style="overflow:auto"><table class="table"><thead><tr><th>Item</th><th>Categoria</th><th>Níveis</th><th>Tempo</th><th>Custo</th></tr></thead><tbody>${(s.top_pending||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.breakdown)}</td><td>${duration(x.secs)}</td><td>${Object.entries(x.cost||{}).map(([k,v])=>`${esc(k)} ${fmt(v)}`).join(' · ')||Object.entries(x.ores||{}).map(([k,v])=>`${esc(k)} ${fmt(v)}`).join(' · ')||'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
async function loadPlan(){const el=$('planBody');if(!el)return;el.innerHTML='<div class="empty">Calculando plano…</div>';try{const p=await api(`/api/accounts/${state.selected}/plan?strategy=balanced`),rows=p.items||p.plan||p.upgrades||[];el.innerHTML=`<div class="section-head"><h2>Planejamento balanceado</h2></div>${rows.length?`<div class="upgrade-list">${rows.slice(0,80).map(x=>`<div class="upgrade"><div></div><div><b>${esc(x.name||x.item||'Upgrade')}</b><small>${esc(x.category||x.queue||'')} ${x.to_lvl?`· nível ${x.to_lvl}`:''}</small></div><div><b>${duration(x.secs||x.duration||0)}</b></div></div>`).join('')}</div>`:`<pre>${esc(JSON.stringify(p,null,2))}</pre>`}` }catch(e){el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function renderHistory(d){const hist=d.history||[],series=d.series||[];return `<div class="section"><div class="section-head"><h2>Histórico de snapshots</h2></div><div class="history">${hist.map(h=>{const s=series.find(x=>x.taken_at===h.taken_at);return `<div class="history-row"><b>${date(h.taken_at)}</b><span>TH ${h.th_level||'—'}</span><div>${s?`<div class="progress"><span style="width:${Math.min(100,+s.progress||0)}%"></span></div><small>${pct(s.progress)} · ${fmt(s.pending)} pendentes</small>`:''}</div></div>`}).join('')||'<div class="empty">Sem histórico.</div>'}</div></div>`}
async function syncOne(){try{await api(`/api/accounts/${state.selected}/sync-supercell`,{method:'POST'});toast('Dados da Supercell atualizados.');state.accounts=await api('/api/accounts');renderVillages();await selectVillage(state.selected)}catch(e){toast(e.message,true)}}
async function syncAll(){try{const r=await api('/api/sync-all',{method:'POST'});toast(`${r.synced}/${r.total} vilas sincronizadas.`);state.accounts=await api('/api/accounts');renderVillages();if(state.selected)await selectVillage(state.selected)}catch(e){toast(e.message,true)}}
function openModal(id){$(id).classList.add('open')}function closeModals(){document.querySelectorAll('.modal-bg').forEach(x=>x.classList.remove('open'))}
async function createVillage(){try{const r=await api('/api/accounts',{method:'POST',json:{name:$('newName').value,tag:$('newTag').value,notes:$('newNotes').value}});closeModals();state.accounts=await api('/api/accounts');renderVillages();await selectVillage(r.id);toast('Vila adicionada.')}catch(e){toast(e.message,true)}}
async function importJson(){try{const txt=$('importJson').value.trim();if(!txt)throw new Error('Cole o JSON do export.');await api(`/api/import${state.selected?`?account_id=${state.selected}`:''}`,{method:'POST',headers:{'Content-Type':'application/json'},body:txt});closeModals();state.accounts=await api('/api/accounts');renderVillages();if(state.selected)await selectVillage(state.selected);toast('Export importado.')}catch(e){toast(e.message,true)}}
async function openSettings(){try{const s=await api('/api/settings');$('settingsBody').innerHTML=`<div class="form"><div class="field"><label><input type="checkbox" id="stNotify" ${s.notify_enabled?'checked':''}> Alertas ativos</label></div><div class="field"><label><input type="checkbox" id="stAutosync" ${s.supercell_autosync?'checked':''}> Auto-sync Supercell</label></div><div class="field"><label>Antecedência (min)</label><input id="stLead" type="number" min="0" max="1440" value="${s.lead_minutes??30}"></div><div class="field"><label>Resumo diário</label><input id="stDigest" placeholder="08:00" value="${esc(s.digest_time||'')}"></div><div class="field"><label>Telegram token</label><input id="stTelegramToken" value="${esc(s.telegram_token||'')}"></div><div class="field"><label>Telegram chat ID</label><input id="stTelegramChat" value="${esc(s.telegram_chat_id||'')}"></div><div class="field full"><label>Discord webhook</label><input id="stDiscord" value="${esc(s.discord_webhook||'')}"></div><div class="field"><label>Evolution URL</label><input id="stEvolutionUrl" value="${esc(s.evolution_url||'')}"></div><div class="field"><label>Instância</label><input id="stEvolutionInstance" value="${esc(s.evolution_instance||'principal')}"></div><div class="field"><label>Evolution API key</label><input id="stEvolutionKey" value="${esc(s.evolution_apikey||'')}"></div><div class="field"><label>Número/JID</label><input id="stEvolutionNumber" value="${esc(s.evolution_number||'')}"></div>${state.me.role==='owner'?`<div class="field full"><label>Token de desenvolvedor Supercell</label><input id="stSupercell" value="${esc(s.supercell_token||'')}"></div>`:''}</div><div class="section"><div class="section-head"><h2>Conta e dados</h2></div><div class="resources"><button class="btn" onclick="generateApiKey()">Gerar API key</button><button class="btn" onclick="exportMyData()">Exportar meus dados</button>${state.me.role==='subscriber'?'<button class="btn danger" onclick="deleteMyData()">Excluir conta e dados</button>':''}${state.me.role==='owner'?'<button class="btn" onclick="loadSubscribers()">Assinantes</button>':''}</div><div id="adminArea"></div></div>`;openModal('settingsModal')}catch(e){toast(e.message,true)}}
async function saveSettings(){const j={notify_enabled:$('stNotify').checked,supercell_autosync:$('stAutosync').checked,lead_minutes:+$('stLead').value||0,digest_time:$('stDigest').value,telegram_token:$('stTelegramToken').value,telegram_chat_id:$('stTelegramChat').value,discord_webhook:$('stDiscord').value,evolution_url:$('stEvolutionUrl').value,evolution_instance:$('stEvolutionInstance').value,evolution_apikey:$('stEvolutionKey').value,evolution_number:$('stEvolutionNumber').value};if($('stSupercell'))j.supercell_token=$('stSupercell').value;try{await api('/api/settings',{method:'PUT',json:j});toast('Configurações salvas.');closeModals()}catch(e){toast(e.message,true)}}
async function generateApiKey(){try{const r=await api('/api/apikey',{method:'POST'});prompt('Copie agora. A chave não será exibida novamente:',r.api_key)}catch(e){toast(e.message,true)}}
async function exportMyData(){try{const d=await api('/api/me/export'),blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='coc-control-meus-dados.json';a.click();URL.revokeObjectURL(url)}catch(e){toast(e.message,true)}}
async function deleteMyData(){if(!confirm('Excluir definitivamente sua conta do COC Control, vilas, snapshots e configurações?'))return;try{await api('/api/me/data',{method:'DELETE'});location.href='/login'}catch(e){toast(e.message,true)}}
async function loadSubscribers(){const el=$('adminArea');try{const xs=await api('/api/admin/subscribers');el.innerHTML=`<div style="margin-top:12px;display:grid;gap:7px">${xs.map(x=>`<div class="resource"><div style="flex:1"><b>${esc(x.name||x.email||('Usuário '+x.id))}</b><small>${x.villages} vilas · ${x.suspended_at?'suspenso':'ativo'}</small></div><button class="btn" onclick="toggleSubscriber(${x.id},${x.suspended_at?'false':'true'})">${x.suspended_at?'Reativar':'Suspender'}</button></div>`).join('')}</div>`}catch(e){el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function toggleSubscriber(id,on){const reason=on?(prompt('Motivo da suspensão manual:','suporte: revisão manual')||''):'';try{await api(`/api/admin/subscribers/${id}/suspension`,{method:'POST',json:{suspended:on,reason}});await loadSubscribers()}catch(e){toast(e.message,true)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}finally{location.href='/login'}}
setInterval(()=>document.querySelectorAll('[data-finish]').forEach(el=>el.textContent=duration(+el.dataset.finish-Math.floor(Date.now()/1000))),1000);boot();
</script>
</body>
</html>
