<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COC Control</title><style>
:root{--bg:#09101d;--panel:#111b2b;--panel2:#17243a;--line:#263a58;--text:#eef5ff;--muted:#91a4c2;--blue:#58a6ff;--green:#42d392;--gold:#f5c451;--red:#ff6b6b;--r:14px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12213a 0,#09101d 45%);color:var(--text);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif}button,input,textarea{font:inherit}.shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0b1423;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:800}.brand span{color:var(--blue)}.small,.muted{color:var(--muted);font-size:12px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 8px}.village{width:100%;display:flex;align-items:center;gap:10px;background:transparent;color:var(--text);border:1px solid transparent;border-radius:11px;padding:9px;text-align:left;cursor:pointer}.village:hover,.village.active{background:var(--panel);border-color:var(--line)}.village img{width:40px;height:40px;object-fit:contain}.main{padding:20px 24px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);color:#06101d;border-color:var(--blue);font-weight:700}.btn.danger{color:#ff9b9b}.hero{display:grid;grid-template-columns:115px 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#16263f,#101a2a);border:1px solid var(--line);border-radius:var(--r);padding:18px}.hero>img{width:105px;height:105px;object-fit:contain}.hero h1{margin:0;font-size:26px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.pill{padding:4px 8px;border-radius:999px;background:#0d1727;border:1px solid var(--line);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:8px 12px;cursor:pointer}.tab.active{background:var(--panel2);color:var(--text);border-color:var(--blue)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}.card b.big{font-size:20px;display:block;margin-top:4px}.section{margin-top:12px}.section h2{font-size:16px;margin:0 0 12px}.progress{height:8px;background:#09111f;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.categories{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.row{display:flex;align-items:center;gap:10px}.resource{display:flex;align-items:center;gap:9px;background:#0d1727;border:1px solid #20324d;border-radius:10px;padding:8px 10px}.resource img{width:34px;height:34px;object-fit:contain}.resources{display:flex;flex-wrap:wrap;gap:8px}.arsenal{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.unit{text-align:center;position:relative}.unit img{width:82px;height:82px;object-fit:contain}.unit .lvl{position:absolute;right:8px;top:8px;background:#080e18;border:1px solid var(--line);border-radius:7px;padding:2px 6px}.unit.max{border-color:#8d7431;box-shadow:inset 0 0 0 1px #4b3f22}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#0e1828;border:1px solid #20324d;border-radius:10px;padding:9px}.item img{width:46px;height:46px;object-fit:contain}.right{text-align:right}.empty{padding:40px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;border-radius:10px;border:1px solid #66531c;background:#2b2411;color:#ffe08a}.error{border-color:#6e3338;background:#2c171a;color:#ffb0b6}.modal-bg{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:20}.modal-bg.open{display:flex}.modal{width:min(620px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.field{display:grid;gap:4px;margin:9px 0}.field input,.field textarea,.field select{background:#0a1321;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px}.field textarea{min-height:180px}.footer{color:var(--muted);font-size:11px;margin-top:30px;text-align:center}.fallback{display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}@media(max-width:780px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:14px}.hero{grid-template-columns:85px 1fr}.hero>img{width:80px;height:80px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">COC <span>Control</span></div><div class="small">Player Intelligence & Upgrade Planner</div><h3>Suas vilas</h3><div id="villages"></div><button class="btn" style="width:100%;margin-top:10px" onclick="openM('new')">+ Adicionar vila</button><button class="btn" style="width:100%;margin-top:8px" onclick="importClipboard()">Importar clipboard</button><button class="btn" style="width:100%;margin-top:8px" onclick="syncAll()">Sincronizar todas</button><button class="btn" id="watcherBtn" style="width:100%;margin-top:8px;display:none" onclick="toggleWatcher()">Watcher</button></aside><main class="main"><div class="top"><button class="btn" onclick="loadAll()">↻ Atualizar</button><div class="spacer"></div><span id="who" class="small"></span><button class="btn" onclick="openSettings()">Configurações</button><button class="btn" onclick="logout()">Sair</button></div><div id="app"><div class="empty">Carregando…</div></div></main></div><div id="toasts"></div>
<div class="modal-bg" id="new"><div class="modal"><h2>Adicionar vila</h2><div class="field"><label>Nome</label><input id="newName" placeholder="Minha vila"></div><div class="field"><label>Tag</label><input id="newTag" placeholder="#2QC998GV"></div><div class="row"><div class="spacer"></div><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="createVillage()">Criar</button></div></div></div>
<div class="modal-bg" id="import"><div class="modal"><h2>Importar JSON oficial</h2><div class="field"><textarea id="jsonText" placeholder="Cole o JSON exportado pelo Clash of Clans"></textarea></div><div class="row"><div class="spacer"></div><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="importJson()">Importar</button></div></div></div>
<div class="modal-bg" id="settings"><div class="modal"><h2>Configurações</h2><div id="settingsBody"></div><div class="row"><div class="spacer"></div><button class="btn" onclick="closeM()">Fechar</button></div></div></div>
<div class="modal-bg" id="edit"><div class="modal"><h2>Editar vila</h2><div class="field"><label>Nome</label><input id="editName"></div><div class="field"><label>Tag</label><input id="editTag"></div><div class="field"><label>Notas</label><input id="editNotes"></div><div class="field"><label>Token de API do jogo para verificar posse</label><input id="verifyToken" autocomplete="off"><button class="btn" onclick="verifyVillage()">Verificar posse</button></div><div class="row"><button class="btn danger" onclick="deleteVillage()">Excluir vila</button><div class="spacer"></div><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveVillage()">Salvar</button></div></div></div>
<script>
const S={me:null,status:null,accounts:[],id:null,d:null,tab:'overview',arsenal:'heroes',plannerStrategy:'balanced'}, A='/static/assets/coc/';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cookie=n=>document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=').slice(1).join('=')||'';
async function api(url,opt={}){const o={...opt,headers:{...(opt.headers||{})}};if('json'in opt){o.body=JSON.stringify(opt.json);o.headers['Content-Type']='application/json'}if(o.method&&o.method!=='GET')o.headers['X-CSRF']=cookie('csrf');const r=await fetch(url,o);let d={};try{d=await r.json()}catch{}if(r.status===401){location='/login';throw Error('não autenticado')}if(r.status===402){renderLapsed(d);throw Error('passe inativo')}if(!r.ok)throw Error(d.error||`Erro ${r.status}`);return d}
const slug=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const under=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const asset=(kind,name)=>`${A}${kind}/${slug(name)}.webp`, th=n=>`${A}townhall/th${n||1}.webp`, resource=k=>`${A}resources/${({Gold:'gold',Elixir:'elixir','Dark Elixir':'dark-elixir',gold:'gold',elixir:'elixir',dark_elixir:'dark-elixir',shiny:'shiny-ore',glowing:'glowing-ore',starry:'starry-ore'}[k]||slug(k))}.webp`;
function gameAsset(cat,name,lvl=1){if(['defense','trap','wall','resource','army','townhall','other'].includes(cat))return `${A}buildings/home-village/${under(name)}/level_${Math.max(1,+lvl||1)}.webp`;return asset(cat==='siege'?'troops':cat,name)}
function image(src,cls=''){return `<img class="${cls}" src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-grid'"><span class="fallback" style="display:none">◈</span>`}
const pct=v=>Number.isFinite(+v)?(+v).toFixed(1)+'%':'—', num=v=>new Intl.NumberFormat('pt-BR',{notation:+v>=1e6?'compact':'standard',maximumFractionDigits:1}).format(+v||0), date=t=>t?new Date(t*1000).toLocaleString('pt-BR'):'—';
function dur(s){s=Math.max(0,+s||0);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return [d&&d+'d',h&&h+'h',m&&m+'m'].filter(Boolean).join(' ')||'<1m'}
function openM(id){closeM();$(id).classList.add('open')}function closeM(){document.querySelectorAll('.modal-bg').forEach(x=>x.classList.remove('open'))}function toast(m){console.log(m)}
async function loadAll(){S.me=await api('/api/me');S.status=await api('/api/status');S.accounts=await api('/api/accounts');$('who').textContent=S.me.name||S.me.email||S.me.role;renderVillages();renderUtilities();if(!S.id&&S.accounts.length)S.id=S.accounts[0].id;if(S.id)await selectVillage(S.id);else renderEmpty()}
function renderVillages(){$('villages').innerHTML=S.accounts.map(a=>`<button class="village ${a.id===S.id?'active':''}" onclick="selectVillage(${a.id})">${image(th(a.latest?.th_level||a.player?.townHallLevel))}<div><b>${esc(a.name)}</b><div class="small">${esc(a.tag||'sem tag')} · ${a.latest?pct(a.latest.progress_total):'sem export'}</div></div></button>`).join('')||'<div class="small">Nenhuma vila</div>'}
async function selectVillage(id){S.id=id;renderVillages();$('app').innerHTML='<div class="empty">Carregando vila…</div>';S.d=await api(`/api/accounts/${id}/detail`);renderDetail()}
function renderEmpty(){$('app').innerHTML='<div class="section empty"><h2>Nenhuma vila cadastrada</h2><p>Cadastre a tag e importe o JSON oficial para iniciar o acompanhamento.</p></div><div class="footer">Conteúdo de fã. COC Control não é afiliado à Supercell.</div>'}
function renderLapsed(d){$('app').innerHTML=`<div class="section"><div class="notice error"><b>Passe inativo.</b> Seus dados continuam guardados.</div><p>${esc(d.error||'Renove o passe na Clash Labs.')}</p>${d.store?`<a class="btn primary" href="${esc(d.store)}">Renovar</a>`:''}</div>`}
function renderDetail(){const d=S.d,a=d.account,s=d.summary||{},p=d.player||{},raw=p._raw||{},level=s.th_level||p.townHallLevel||1,clan=p.clan||{};$('app').innerHTML=`<div class="hero">${image(th(level))}<div><h1>${esc(a.name)}</h1><div class="muted">${esc(a.tag||'sem tag')} · CV ${level}${a.verified?' · conta verificada':''}</div><div class="badges"><span class="pill">${esc(p.league||'Liga não sincronizada')}</span>${p.trophies!=null?`<span class="pill">🏆 ${num(p.trophies)}</span>`:''}${clan.name?`<span class="pill">Clã: ${esc(clan.name)}</span>`:''}</div></div></div><div class="tabs">${['overview','arsenal','upgrades','planner','history'].map(k=>`<button class="tab ${S.tab===k?'active':''}" onclick="tab('${k}')">${({overview:'Visão geral',arsenal:'Arsenal',upgrades:'Upgrades',planner:'Planejador',history:'Histórico'})[k]}</button>`).join('')}<button class="tab" onclick="openM('import')">Importar JSON</button><button class="tab" onclick="syncSC()">Sync Supercell</button><button class="tab" onclick="openEdit()">Editar vila</button></div><div id="view"></div><div class="footer">Dados combinados do export oficial e da API oficial do Clash of Clans. Conteúdo de fã; não afiliado à Supercell.</div>`;tab(S.tab)}
function tab(k){S.tab=k;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent.trim()===({overview:'Visão geral',arsenal:'Arsenal',upgrades:'Upgrades',planner:'Planejador',history:'Histórico'})[k]));const v=$('view');if(k==='overview')v.innerHTML=overview();if(k==='arsenal')v.innerHTML=arsenal();if(k==='upgrades')v.innerHTML=upgrades();if(k==='planner')planner();if(k==='history')v.innerHTML=history()}
function resources(o,label='restante'){return Object.entries(o||{}).filter(([,v])=>+v>0).map(([k,v])=>`<div class="resource"><img src="${resource(k)}" onerror="this.style.display='none'"><div><b>${num(v)}</b><div class="small">${esc(k)} · ${label}</div></div></div>`).join('')||'<span class="small">Sem custo conhecido</span>'}
function overview(){const s=S.d.summary||{},p=S.d.player||{},b=s.builders||{},cats=s.categories||{};return `<div class="grid stats"><div class="card"><span class="small">Progresso</span><b class="big">${pct(s.progress_total)}</b><div class="progress"><i style="width:${+s.progress_total||0}%"></i></div></div><div class="card"><span class="small">Construtores</span><b class="big">${b.available??'—'} livres</b><span class="small">${b.busy??0}/${b.total??0} ocupados</span></div><div class="card"><span class="small">Caminho crítico</span><b class="big">${dur(s.eta?.critical_secs)}</b></div><div class="card"><span class="small">Troféus</span><b class="big">${p.trophies==null?'—':num(p.trophies)}</b><span class="small">melhor ${p.bestTrophies==null?'—':num(p.bestTrophies)}</span></div></div><div class="section"><h2>Progresso por categoria</h2><div class="grid categories">${Object.entries(cats).map(([k,c])=>`<div class="card"><div class="row"><b>${esc(c.label||k)}</b><div class="spacer"></div><b>${pct(c.progress)}</b></div><div class="progress"><i style="width:${+c.progress||0}%"></i></div><div class="small">${c.pending_levels||0} níveis pendentes</div></div>`).join('')}</div></div><div class="section"><h2>Recursos necessários</h2><div class="resources">${resources(s.cost_left)}</div></div><div class="section"><h2>Minérios necessários</h2><div class="resources">${resources(s.ores_needed)}</div></div>`}
const PETS=new Set(['L.A.S.S.I','Electro Owl','Mighty Yak','Unicorn','Frosty','Diggy','Poison Lizard','Phoenix','Spirit Fox','Angry Jelly','Sneezy']);
function arsenalSets(){const r=S.d.player?._raw||{},troops=r.troops||[];return {heroes:r.heroes||[],equipment:r.heroEquipment||r.equipment||[],troops:troops.filter(x=>!PETS.has(x.name)&&!String(x.name).toLowerCase().includes('siege')),spells:r.spells||[],pets:troops.filter(x=>PETS.has(x.name)),siege:troops.filter(x=>String(x.name).toLowerCase().includes('siege')||['Wall Wrecker','Battle Blimp','Stone Slammer','Siege Barracks','Log Launcher','Flame Flinger','Battle Drill'].includes(x.name))}}
function arsenal(){const sets=arsenalSets(),labels={heroes:'Heróis',equipment:'Equipamentos',troops:'Tropas',spells:'Feitiços',siege:'Cerco',pets:'Pets'},kind={heroes:'heroes',equipment:'equipment',troops:'troops',spells:'spells',siege:'troops',pets:'pets'};return `<div class="section"><h2>Arsenal</h2>${Object.keys(labels).map(k=>`<h3>${labels[k]} <span class="small">(${sets[k].length})</span></h3><div class="grid arsenal">${sets[k].map(x=>`<div class="card unit ${x.maxLevel&&x.level>=x.maxLevel?'max':''}">${image(asset(kind[k],x.name))}<div class="lvl">${x.level??'—'}${x.maxLevel?' / '+x.maxLevel:''}</div><b>${esc(x.name)}</b></div>`).join('')||'<span class="small">Sem dados</span>'}</div>`).join('')}</div>`}
function upgrades(){const s=S.d.summary||{},act=s.active_upgrades||[],pending=s.top_pending||[];return `<div class="section"><h2>Em andamento</h2><div class="list">${act.map(x=>`<div class="item">${image(gameAsset(x.category,x.name,x.to_lvl))}<div><b>${esc(x.name)}</b><div class="small">nível ${x.from_lvl} → ${x.to_lvl} · ${esc(x.queue)}</div></div><div class="right"><b>${dur(x.secs_left)}</b><div class="small">${date(x.finish_ts)}</div></div></div>`).join('')||'<div class="small">Nenhum upgrade ativo no último export.</div>'}</div></div><div class="section"><h2>Principais pendências</h2><div class="list">${pending.slice(0,80).map(x=>`<div class="item">${image(gameAsset(x.category,x.name,1))}<div><b>${esc(x.name)}</b><div class="small">${esc(x.breakdown||'')} · ${esc(x.category)}</div></div><div class="right"><b>${dur(x.secs)}</b></div></div>`).join('')}</div></div>`}
async function planner(){const v=$('view');v.innerHTML=`<div class="section"><div class="row"><h2 style="margin:0">Planejador</h2><div class="spacer"></div><select id="planStrategy" onchange="S.plannerStrategy=this.value;planner()"><option value="balanced">Balanceado</option><option value="defense">Defesa</option><option value="farm">Farm</option><option value="fast">Mais rápido</option><option value="cheap">Mais barato</option></select></div><div class="empty">Calculando…</div></div>`;$('planStrategy').value=S.plannerStrategy;try{const p=await api(`/api/accounts/${S.id}/plan?strategy=${encodeURIComponent(S.plannerStrategy)}`),rows=p.items||p.plan||p.upgrades||[];v.querySelector('.empty').outerHTML=`<div class="list">${rows.slice(0,100).map(x=>`<div class="item"><span class="fallback">↗</span><div><b>${esc(x.name||x.item||'Upgrade')}</b><div class="small">${esc(x.category||x.queue||'')} ${x.to_lvl?'· nível '+x.to_lvl:''}</div></div><div class="right">${dur(x.secs||x.duration)}</div></div>`).join('')||`<pre>${esc(JSON.stringify(p,null,2))}</pre>`}</div>`}catch(e){v.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function history(){const d=S.d;return `<div class="section"><h2>Histórico de snapshots</h2><div class="list">${(d.history||[]).map(x=>`<div class="item"><span class="fallback">◷</span><div><b>CV ${x.th_level||'—'}</b><div class="small">Snapshot #${x.id}</div></div><div class="right">${date(x.taken_at)}</div></div>`).join('')||'<div class="small">Sem histórico.</div>'}</div></div>`}
async function createVillage(){try{await api('/api/accounts',{method:'POST',json:{name:$('newName').value,tag:$('newTag').value}});closeM();S.id=null;await loadAll()}catch(e){alert(e.message)}}
async function importJson(){try{const txt=$('jsonText').value;await api(`/api/import?account_id=${S.id}`,{method:'POST',json:{json:JSON.parse(txt)}});closeM();await selectVillage(S.id)}catch(e){alert(e.message)}}
async function syncSC(){try{await api(`/api/accounts/${S.id}/sync-supercell`,{method:'POST'});await selectVillage(S.id)}catch(e){alert(e.message)}}
async function openSettings(){const s=await api('/api/settings');$('settingsBody').innerHTML=`<h3>Alertas</h3><div class="field"><label><input type="checkbox" id="notify" ${s.notify_enabled?'checked':''}> Alertas ativos</label></div>${S.me.role==='owner'?`<div class="field"><label><input type="checkbox" id="toast" ${s.toast_enabled?'checked':''}> Toast do Windows</label></div>`:''}<div class="field"><label>Antecedência (min)</label><input id="lead" type="number" min="0" max="1440" value="${s.lead_minutes??30}"></div><div class="field"><label>Resumo diário</label><input id="digest" value="${esc(s.digest_time||'')}" placeholder="08:00"></div><div class="field"><label>Telegram token</label><input id="telegramToken" value="${esc(s.telegram_token||'')}" autocomplete="off"></div><div class="field"><label>Telegram chat ID</label><input id="telegramChat" value="${esc(s.telegram_chat_id||'')}"></div><div class="field"><label>Discord webhook</label><input id="discordWebhook" value="${esc(s.discord_webhook||'')}"></div><h3>WhatsApp / Evolution API</h3><div class="field"><label>URL</label><input id="evolutionUrl" value="${esc(s.evolution_url||'')}"></div><div class="field"><label>API key</label><input id="evolutionKey" value="${esc(s.evolution_apikey||'')}" autocomplete="off"></div><div class="field"><label>Instância</label><input id="evolutionInstance" value="${esc(s.evolution_instance||'principal')}"></div><div class="field"><label>Número/JID</label><input id="evolutionNumber" value="${esc(s.evolution_number||'')}"></div><h3>Supercell</h3><div class="field"><label><input type="checkbox" id="scAutosync" ${s.supercell_autosync?'checked':''}> Sincronizar API no import</label></div>${S.me.role==='owner'?`<div class="field"><label>Token de desenvolvedor Supercell</label><input id="supercellToken" value="${esc(s.supercell_token||'')}" autocomplete="off"></div>`:`<div class="small">Token do servidor: ${s.supercell_configured?'configurado':'não configurado'}</div>`}<div class="row"><button class="btn primary" onclick="saveSettings()">Salvar</button><button class="btn" onclick="testNotification()">Testar alerta</button></div><hr style="border-color:var(--line)"><h3>API e dados</h3><div class="small">API key atual: ${S.me.api_key_hint?'••••'+esc(S.me.api_key_hint):'não gerada'}</div><div class="row"><button class="btn" onclick="newApiKey()">Gerar nova API key</button><button class="btn" onclick="exportData()">Exportar meus dados</button>${S.me.role==='subscriber'?'<button class="btn danger" onclick="deleteData()">Excluir conta e dados</button>':''}${S.me.role==='owner'?'<button class="btn" onclick="loadSubscribers()">Assinantes</button>':''}</div><div id="apiKeyOnce"></div><div id="subs"></div>`;openM('settings')}
async function saveSettings(){try{const body={notify_enabled:$('notify').checked,lead_minutes:+$('lead').value,digest_time:$('digest').value,telegram_token:$('telegramToken').value,telegram_chat_id:$('telegramChat').value,discord_webhook:$('discordWebhook').value,evolution_url:$('evolutionUrl').value,evolution_apikey:$('evolutionKey').value,evolution_instance:$('evolutionInstance').value,evolution_number:$('evolutionNumber').value,supercell_autosync:$('scAutosync').checked};if(S.me.role==='owner'){body.toast_enabled=$('toast').checked;body.supercell_token=$('supercellToken').value}await api('/api/settings',{method:'PUT',json:body});alert('Configurações salvas')}catch(e){alert(e.message)}}
function exportData(){location='/api/me/export'}async function deleteData(){if(!confirm('Excluir permanentemente suas vilas, snapshots e configurações?'))return;await api('/api/me/data',{method:'DELETE'});location='/login'}
async function loadSubscribers(){const xs=await api('/api/admin/subscribers');$('subs').innerHTML='<h3>Assinantes</h3>'+xs.map(x=>`<div class="resource"><div><b>${esc(x.name||x.email||x.labs_user_id)}</b><div class="small">${x.villages} vilas · ${x.suspended_at?'suspenso':'ativo'}</div></div><div class="spacer"></div><button class="btn" onclick="suspend(${x.id},${x.suspended_at?'false':'true'})">${x.suspended_at?'Reativar':'Suspender'}</button></div>`).join('')}
async function suspend(id,on){let reason='';if(on)reason=prompt('Motivo da suspensão:')||'';await api(`/api/admin/subscribers/${id}/suspension`,{method:'POST',json:{suspended:on,reason}});loadSubscribers()}
function renderUtilities(){const b=$('watcherBtn');if(S.me?.role==='owner'&&S.status?.watcher?.available){b.style.display='block';b.textContent=`Watcher: ${S.status.watcher.enabled?'ligado':'desligado'}`}else b.style.display='none'}
async function toggleWatcher(){try{const r=await api('/api/watcher',{method:'POST',json:{enabled:!S.status?.watcher?.enabled}});S.status.watcher.enabled=r.enabled;renderUtilities()}catch(e){alert(e.message)}}
async function importClipboard(){try{const text=await navigator.clipboard.readText();await api(`/api/import${S.id?'?account_id='+S.id:''}`,{method:'POST',json:{json:JSON.parse(text)}});await loadAll()}catch(e){alert('Não foi possível importar do clipboard: '+e.message)}}
async function syncAll(){try{const r=await api('/api/sync-all',{method:'POST'});alert(`${r.synced}/${r.total} vilas sincronizadas`);await loadAll()}catch(e){alert(e.message)}}
function openEdit(){const a=S.d.account;$('editName').value=a.name||'';$('editTag').value=a.tag||'';$('editNotes').value=a.notes||'';$('verifyToken').value='';openM('edit')}
async function saveVillage(){try{await api(`/api/accounts/${S.id}`,{method:'PATCH',json:{name:$('editName').value,tag:$('editTag').value,notes:$('editNotes').value}});closeM();await loadAll()}catch(e){alert(e.message)}}
async function deleteVillage(){if(!confirm('Excluir esta vila e todo o histórico?'))return;try{await api(`/api/accounts/${S.id}`,{method:'DELETE'});closeM();S.id=null;await loadAll()}catch(e){alert(e.message)}}
async function verifyVillage(){try{const r=await api(`/api/accounts/${S.id}/verify`,{method:'POST',json:{token:$('verifyToken').value}});alert(r.verified?'Posse verificada':'Token não validado');await selectVillage(S.id)}catch(e){alert(e.message)}}
async function newApiKey(){try{const r=await api('/api/apikey',{method:'POST'});$('apiKeyOnce').innerHTML=`<div class="notice"><b>Copie agora. Ela não será mostrada novamente.</b><br><code>${esc(r.api_key)}</code></div>`;S.me.api_key_hint=r.hint}catch(e){alert(e.message)}}
async function testNotification(){try{const r=await api('/api/notify/test',{method:'POST'});alert(r.sent?.length?`Enviado: ${r.sent.join(', ')}`:'Nenhum canal enviou o teste')}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location='/login'}
loadAll().catch(e=>$('app').innerHTML=`<div class="notice error">${esc(e.message)}</div>`);
</script></body></html>
