name: COC Control Tests

on:
  push:
    branches:
      - refactor/clash-labs-player-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m py_compile app.py coc/*.py tools/import_coc_assets.py tests/test_contract_refactor.py tests/test_local_login.py

      - name: Validate faceoff UI and modal safety
        run: |
          test -f static/faceoff-theme.css
          test -f static/assets/branding/soul-weaver.webp
          test -f static/assets/branding/void-archmage.webp
          grep -q "faceoff-scene" static/fantasy-theme.js
          grep -q "soul-weaver.webp?v=20260926-5" static/fantasy-theme.js
          grep -q "void-archmage.webp?v=20260926-5" static/fantasy-theme.js
          grep -q "pointer-events: none" static/faceoff-theme.css
          grep -q "position: fixed !important" static/faceoff-theme.css
          grep -q ".modal-bg.open" static/faceoff-theme.css
          grep -q "faceoff-critical" static/fantasy-theme.js

      - name: Run regression suite
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python tests/test_auth.py
          python tests/test_basic.py
          python tests/test_features.py
          python tests/test_matcher.py
          python tests/test_sync_all.py
          python tests/test_multiuser.py
          python tests/test_contract_refactor.py
          python tests/test_local_login.py
